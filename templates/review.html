<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/_rr/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="reviewroom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e4e2db" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080a" media="(prefers-color-scheme: dark)">
<script type="module" src="/_rr/reviewroom.js"></script>
<style>
  /* Your own styles go here. Everything inside <rr-review> is yours. */
</style>
</head>
<body>
<rr-app>
  <script type="application/json" id="rr-meta">{}</script>
  <rr-review>
    <!-- Freeform HTML. Building blocks and rr: links: skills/reviewroom/references/authoring.md -->
    <h1>{{TITLE}}</h1>
    <p class="rr-lede">One-paragraph summary of what this change does and why.</p>

    <section id="overview">
      <h2>What changed</h2>
      <rr-flow direction="column">
        <rr-node state="baseline">Existing entry point</rr-node>
        <rr-node state="new">New piece</rr-node>
        <rr-node>Downstream</rr-node>
      </rr-flow>
      <ul>
{{FILES}}
      </ul>
    </section>

    <section id="risks">
      <h2>Open questions</h2>
      <rr-checklist>
        <rr-check id="compat">Backwards compatible</rr-check>
        <rr-check id="tests">Tests cover the new paths</rr-check>
      </rr-checklist>
    </section>
  </rr-review>
</rr-app>
</body>
</html>
