# Toolchain + tasks. `mise install` once, then `mise run setup`.
[tools]
node = "22"   # runs the CLI (zero dependencies, plain Node)
bun = "1.4"   # installs deps, bundles the client, runs scripts

[tasks.setup]
description = "Install dependencies, build, and put `reviewroom` on your PATH"
run = ["bun install", "bun run build", "bun link"]

[tasks.build]
description = "Build dist/ (client bundle + css)"
run = "bun run build"

[tasks.dev]
description = "Rebuild on change"
run = "bun run dev"

[tasks.typecheck]
description = "Type-check the client and the CLI"
run = "bun run typecheck"

[tasks.lint]
description = "Lint (oxlint, type-aware), dead code and unused deps (knip), copy-paste (jscpd)"
run = "bun run lint"

[tasks.test]
description = "Unit tests (bun test, *.test.ts next to the code)"
run = "bun test"

[tasks.smoke]
description = "End-to-end: demo repo → reviewroom pr → API responds"
depends = ["build"]
run = "bun scripts/smoke.ts"

[tasks.check]
description = "Everything an agent should run before committing"
depends = ["typecheck", "lint", "test", "smoke"]

[tasks.demo]
description = "Create the demo repo in .demo/ and open it in reviewroom"
depends = ["build"]
run = [
  "bash examples/make-demo-repo.sh .demo/mfas",
  "node dist/cli/reviewroom.mjs pr feat/habit-events --repo .demo/mfas --dir examples/habit-events",
]

[tasks.demo-page]
description = "Build the self-contained demo HTML (static fixture, no server)"
depends = ["build"]
run = [
  "bash examples/make-demo-repo.sh .demo/mfas",
  "bun scripts/build-demo.ts .demo/mfas main feat/habit-events examples/habit-events .demo/reviewroom-demo.html",
]
